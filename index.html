<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Battery Sales</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <!-- =========================
             Header
        ========================== -->

        <header class="header">

            <div class="logo">
                <div class="logo-icon">🔋</div>

                <div>
                    <h1>Battery Sales</h1>
                    <p>Battery registration system</p>
                </div>
            </div>

        </header>


        <!-- =========================
             Main Card
        ========================== -->

        <section class="card">

            <div class="status">
                <span class="status-dot"></span>
                New Battery Sale
            </div>


            <h2>Customer Information</h2>

            <p class="description">
                Please enter the customer information
                to register this battery sale.
            </p>


            <!-- =========================
                 Battery Information
            ========================== -->

            <div class="section-title">
                Battery Information
            </div>


            <div class="form-group">

                <label for="batteryId">
                    Battery ID
                </label>

                <input type="text" id="batteryId" placeholder="Waiting for QR code..." readonly>

                <p id="batteryStatus" class="field-hint">
                    Scan a battery QR code to continue.
                </p>

            </div>


            <!-- =========================
                 Customer Form
            ========================== -->

            <form id="salesForm">

                <div class="section-title">
                    Customer Information
                </div>


                <!-- Customer Name -->

                <div class="form-group">

                    <label for="customerName">
                        Customer Name
                    </label>

                    <input type="text" id="customerName" placeholder="Enter customer name" autocomplete="name" required>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" placeholder="Enter phone number" inputmode="numeric" autocomplete="tel"
                        required>

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea id="address" rows="3" placeholder="Enter customer address" required></textarea>

                </div>


                <!-- Branch -->

                <div class="form-group">

                    <label for="branch">
                        Branch
                    </label>

                    <select id="branch" required>

                        <option value="">
                            Select branch
                        </option>

                        <option value="Yangon">
                            Yangon
                        </option>

                        <option value="Mandalay">
                            Mandalay
                        </option>

                        <option value="Naypyidaw">
                            Naypyidaw
                        </option>

                    </select>

                </div>


                <!-- =========================
                     Message
                ========================== -->

                <div id="message" class="message hidden"></div>


                <!-- =========================
                     Submit
                ========================== -->

                <button type="submit" id="submitButton" class="submit-button">
                    Register Sale
                </button>

            </form>

        </section>


        <!-- =========================
             Footer
        ========================== -->

        <footer>
            Battery Sales System © 2026
        </footer>

    </main>


    <!-- Main JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
